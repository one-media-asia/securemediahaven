server {
    listen 80;
    listen [::]:80;
    server_name hosting.yourdomain.com;
    root /var/www/hosting.yourdomain.com/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.yourdomain.com;
    root /var/www/panel.yourdomain.com/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hosting.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/hosting.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosting.yourdomain.com/privkey.pem;

    root /var/www/hosting.yourdomain.com/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

                    server {
    listen 80;
    listen [::]:80;
    server_name hosting.onemedia.asia;
    root /var/www/hosting.onemedia.asia/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.onemedia.asia;
    root /var/www/panel.onemedia.asia/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hosting.onemedia.asia;

    ssl_certificate /etc/letsencrypt/live/hosting.onemedia.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosting.onemedia.asia/privkey.pem;

    root /var/www/hosting.onemedia.asia/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">No training wheels. Just ask.</title>
  <desc id="description">A cybersecurity walkthrough showing how CyberAgent can explain common security tools, authorized scope, and safe next steps.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d6d7cb" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#324c40" opacity=".4"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#18251f" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#f1efe5"/>
  <rect width="1080" height="1350" fill="url(#grid)" opacity=".58"/>
  <path d="M0 0H1080V32H0z" fill="#c7e34a"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#1d2923">
    <text x="76" y="91" font-size="18" font-weight="700" letter-spacing="2">CYBER FIELD NOTE 01 / TOOL WALKTHROUGH</text>
    <text x="1004" y="91" font-size="15" text-anchor="end" fill="#526057">CYBERAGENT</text>

    <text x="72" y="206" font-size="78" font-weight="800" letter-spacing="-2">NO TRAINING</text>
    <text x="72" y="290" font-size="78" font-weight="800" letter-spacing="-2">WHEELS.</text>
    <rect x="72" y="321" width="386" height="8" rx="4" fill="#c7e34a"/>
    <text x="72" y="379" font-size="30" font-weight="500">New security tool?</text>
    <text x="72" y="420" font-size="30" font-weight="500">Ask what it does before you use it.</text>

    <g transform="translate(72 474)" filter="url(#shadow)">
      <rect width="936" height="482" rx="18" fill="#fffef8" stroke="#c7c9bd" stroke-width="2"/>
      <path d="M18 0H918a18 18 0 0 1 18 18v44H0V18A18 18 0 0 1 18 0" fill="#324c40"/>
      <circle cx="31" cy="31" r="6" fill="#c7e34a"/>
      <text x="52" y="37" fill="#f7f5eb" font-size="16" font-weight="700" letter-spacing="1.4">NAME IT / ASK / USE IT SAFELY</text>
      <text x="908" y="37" fill="#c7d1c9" font-size="14" text-anchor="end">01: CYBER TOOLS</text>

      <rect x="28" y="88" width="495" height="356" rx="10" fill="#e9eee4"/>
      <rect x="28" y="88" width="495" height="356" rx="10" fill="url(#dots)" opacity=".72"/>

      <rect x="52" y="105" width="447" height="324" rx="12" fill="#1d2923"/>
      <circle cx="76" cy="130" r="5" fill="#fa6b4b"/>
      <circle cx="94" cy="130" r="5" fill="#c7e34a"/>
      <circle cx="112" cy="130" r="5" fill="#78907d"/>
      <text x="135" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#d7ded7">CYBER TOOLKIT / AUTHORIZED USE</text>

      <g font-family="Arial, Helvetica, sans-serif">
        <rect x="70" y="157" width="411" height="75" rx="7" fill="#fffef8"/>
        <rect x="70" y="157" width="7" height="75" rx="3" fill="#c7e34a"/>
        <text x="94" y="188" font-size="20" font-weight="700" fill="#1d2923">Nmap</text>
        <text x="94" y="213" font-size="15" fill="#526057">Discover hosts and map exposed services</text>

        <rect x="70" y="244" width="411" height="75" rx="7" fill="#fffef8"/>
        <rect x="70" y="244" width="7" height="75" rx="3" fill="#fa6b4b"/>
        <text x="94" y="275" font-size="20" font-weight="700" fill="#1d2923">Wireshark</text>
        <text x="94" y="300" font-size="15" fill="#526057">Inspect network traffic and protocols</text>

        <rect x="70" y="331" width="411" height="75" rx="7" fill="#fffef8"/>
        <rect x="70" y="331" width="7" height="75" rx="3" fill="#78907d"/>
        <text x="94" y="362" font-size="20" font-weight="700" fill="#1d2923">OWASP ZAP</text>
        <text x="94" y="387" font-size="15" fill="#526057">Test web apps you’re authorized to assess</text>
      </g>

      <path d="M548 105v320" stroke="#d7d9ce" stroke-width="2"/>
      <text x="578" y="122" font-size="14" font-weight="700" letter-spacing="1.2" fill="#657167">YOU MEET A NEW TOOL</text>
      <text x="578" y="163" font-size="22" font-weight="700">“What does it do?”</text>

      <rect x="578" y="191" width="330" height="133" rx="10" fill="#324c40"/>
      <text x="600" y="225" font-size="14" font-weight="700" letter-spacing="1" fill="#c7e34a">CYBERAGENT</text>
      <text x="600" y="260" font-size="18" fill="#fffef8">“Name the tool or paste its</text>
      <text x="600" y="287" font-size="18" fill="#fffef8">output. I’ll explain what it shows,</text>
      <text x="600" y="314" font-size="18" fill="#fffef8">safe scope, and what to verify.”</text>

      <g font-size="17" font-weight="700">
        <circle cx="594" cy="361" r="13" fill="#c7e34a"/>
        <path d="m588 361 4 4 8-9" fill="none" stroke="#263a30" stroke-width="2.5"/>
        <text x="619" y="367">Plain-language purpose</text>
        <circle cx="594" cy="395" r="13" fill="#c7e34a"/>
        <path d="m588 395 4 4 8-9" fill="none" stroke="#263a30" stroke-width="2.5"/>
        <text x="619" y="401">Authorized testing scope</text>
        <circle cx="594" cy="429" r="13" fill="#c7e34a"/>
        <path d="m588 429 4 4 8-9" fill="none" stroke="#263a30" stroke-width="2.5"/>
        <text x="619" y="435">Defensive next steps</text>
      </g>
    </g>

    <text x="76" y="1031" font-size="17" font-weight="700" letter-spacing="1.5" fill="#526057">NO CYBERSECURITY DEGREE REQUIRED</text>
    <text x="76" y="1083" font-size="32" font-weight="700">Start with what you know.</text>
    <text x="76" y="1125" font-size="23" fill="#46564b">Get the plain-English version, then choose a safe next step.</text>

    <path d="M76 1175H1004" stroke="#aeb5a9" stroke-width="2"/>
    <text x="76" y="1225" font-size="16" font-weight="700" letter-spacing="1.2">A GOOD FIRST PROMPT</text>
    <text x="76" y="1267" font-size="22" font-weight="500">“What does Nmap show, and what can’t it tell me?”</text>
    <text x="1004" y="1313" text-anchor="end" font-size="14" fill="#657167">Illustrative defensive-security scenario</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">No training wheels. Just ask.</title>
  <desc id="description">A lab walkthrough scenario showing how an AI agent can help explain unfamiliar equipment, describe likely functions, and flag what needs verification.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d6d7cb" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#324c40" opacity=".4"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#18251f" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#f1efe5"/>
  <rect width="1080" height="1350" fill="url(#grid)" opacity=".58"/>
  <path d="M0 0H1080V32H0z" fill="#c7e34a"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#1d2923">
    <text x="76" y="91" font-size="18" font-weight="700" letter-spacing="2">FIELD NOTE 01 / LAB WALKTHROUGH</text>
    <text x="1004" y="91" font-size="15" text-anchor="end" fill="#526057">ROLE-PLAY SCENARIO</text>

    <text x="72" y="206" font-size="78" font-weight="800" letter-spacing="-2">NO TRAINING</text>
    <text x="72" y="290" font-size="78" font-weight="800" letter-spacing="-2">WHEELS.</text>
    <rect x="72" y="321" width="386" height="8" rx="4" fill="#c7e34a"/>
    <text x="72" y="379" font-size="30" font-weight="500">Unfamiliar lab gear?</text>
    <text x="72" y="420" font-size="30" font-weight="500">Ask your agent what it might do.</text>

    <g transform="translate(72 474)" filter="url(#shadow)">
      <rect width="936" height="482" rx="18" fill="#fffef8" stroke="#c7c9bd" stroke-width="2"/>
      <path d="M18 0H918a18 18 0 0 1 18 18v44H0V18A18 18 0 0 1 18 0" fill="#324c40"/>
      <circle cx="31" cy="31" r="6" fill="#c7e34a"/>
      <text x="52" y="37" fill="#f7f5eb" font-size="16" font-weight="700" letter-spacing="1.4">OBSERVE / ASK / UNDERSTAND</text>
      <text x="908" y="37" fill="#c7d1c9" font-size="14" text-anchor="end">01: LAB SCENE</text>

      <rect x="28" y="88" width="495" height="356" rx="10" fill="#e9eee4"/>
      <rect x="28" y="88" width="495" height="356" rx="10" fill="url(#dots)" opacity=".72"/>

      <g stroke="#263a30" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M66 365H483" fill="none" stroke-width="8"/>
        <path d="M94 365v35m349-35v35" fill="none" stroke-width="8"/>
        <rect x="94" y="254" width="132" height="111" rx="9" fill="#f7f6ec"/>
        <path d="M111 254v-24h98v24" fill="#c7e34a"/>
        <circle cx="160" cy="307" r="32" fill="#dce5d8"/>
        <circle cx="160" cy="307" r="9" fill="#324c40" stroke="none"/>
        <path d="M256 365V233q0-10 10-10h78q10 0 10 10v132" fill="#fffef8"/>
        <path d="M268 254h74v61h-74z" fill="#c7e34a"/>
        <path d="M279 272h51m-51 13h34" fill="none" stroke-width="4"/>
        <rect x="377" y="285" width="78" height="80" rx="7" fill="#f7f6ec"/>
        <path d="M392 285v-36h48v36m-24-36v-23" fill="none"/>
        <path d="M402 325h27" fill="none" stroke-width="4"/>
        <path d="M390 347h49" fill="none" stroke="#78907d" stroke-width="4"/>
        <path d="M78 197h163" fill="none" stroke="#78907d" stroke-width="3"/>
        <path d="M78 197v40m163-40v40" fill="none" stroke="#78907d" stroke-width="3"/>
      </g>

      <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
        <circle cx="122" cy="244" r="17" fill="#c7e34a" stroke="#263a30" stroke-width="3"/>
        <text x="122" y="250" text-anchor="middle" font-size="16" fill="#1d2923">?</text>
        <circle cx="307" cy="214" r="17" fill="#c7e34a" stroke="#263a30" stroke-width="3"/>
        <text x="307" y="220" text-anchor="middle" font-size="16" fill="#1d2923">?</text>
        <circle cx="418" cy="275" r="17" fill="#c7e34a" stroke="#263a30" stroke-width="3"/>
        <text x="418" y="281" text-anchor="middle" font-size="16" fill="#1d2923">?</text>
      </g>

      <path d="M548 105v320" stroke="#d7d9ce" stroke-width="2"/>
      <text x="578" y="122" font-size="14" font-weight="700" letter-spacing="1.2" fill="#657167">YOU SPOT SOMETHING</text>
      <text x="578" y="163" font-size="22" font-weight="700">“What is this?”</text>

      <rect x="578" y="191" width="330" height="133" rx="10" fill="#324c40"/>
      <text x="600" y="225" font-size="14" font-weight="700" letter-spacing="1" fill="#c7e34a">YOUR AGENT</text>
      <text x="600" y="260" font-size="18" fill="#fffef8">“Share a photo or label.</text>
      <text x="600" y="287" font-size="18" fill="#fffef8">I’ll explain likely uses and</text>
      <text x="600" y="314" font-size="18" fill="#fffef8">flag what needs checking.”</text>

      <g font-size="17" font-weight="700">
        <circle cx="594" cy="361" r="13" fill="#c7e34a"/>
        <path d="m588 361 4 4 8-9" fill="none" stroke="#263a30" stroke-width="2.5"/>
        <text x="619" y="367">Plain-language explanation</text>
        <circle cx="594" cy="395" r="13" fill="#c7e34a"/>
        <path d="m588 395 4 4 8-9" fill="none" stroke="#263a30" stroke-width="2.5"/>
        <text x="619" y="401">Likely purpose, with caveats</text>
        <circle cx="594" cy="429" r="13" fill="#c7e34a"/>
        <path d="m588 429 4 4 8-9" fill="none" stroke="#263a30" stroke-width="2.5"/>
        <text x="619" y="435">Next questions for an expert</text>
      </g>
    </g>

    <text x="76" y="1031" font-size="17" font-weight="700" letter-spacing="1.5" fill="#526057">NO SPECIALIST VOCABULARY REQUIRED</text>
    <text x="76" y="1083" font-size="32" font-weight="700">Start with what you see.</text>
    <text x="76" y="1125" font-size="23" fill="#46564b">The agent helps you get oriented, then shows what to verify.</text>

    <path d="M76 1175H1004" stroke="#aeb5a9" stroke-width="2"/>
    <text x="76" y="1225" font-size="16" font-weight="700" letter-spacing="1.2">A GOOD FIRST PROMPT</text>
    <text x="76" y="1267" font-size="22" font-weight="500">“Identify this equipment from the photo. What details would confirm it?”</text>
    <text x="1004" y="1313" text-anchor="end" font-size="14" fill="#657167">Illustrative scenario / not an equipment identification</text>
  </g>
</svg>